[auth]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[functions.school-id-auth]
# School ID sign-in and recovery happen before the user has a session JWT.
# The function performs its own input validation and delegates password
# verification to Supabase Auth.
verify_jwt = false

[functions.email-auth]
# Email sign-in is performed before the browser has a user session JWT.
verify_jwt = false
